name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"   # Node 20 reached end of life in April 2026
      - name: Unit tests
        run: node --test
      - name: "Generated regions match committed data (offline; upstream drift is sync-site's job)"
        env:
          SYNC_OFFLINE: "1"
        run: |
          node scripts/stamp-chrome.mjs --check
          node scripts/sync-writing.mjs --check
          node scripts/sync-versions.mjs --check
      - name: Links, anchors and no runtime external calls
        run: node scripts/check-links.mjs
