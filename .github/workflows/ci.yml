name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"   # Node 20 reached end of life in April 2026
      - name: Unit tests
        run: node --test
      - name: "Generated regions match committed data (offline; upstream drift is sync-site's job)"
        env:
          SYNC_OFFLINE: "1"
        run: |
          node scripts/stamp-chrome.mjs --check
          node scripts/sync-writing.mjs --check
          node scripts/sync-versions.mjs --check
      - name: Links, anchors and no runtime external calls
        run: node scripts/check-links.mjs
