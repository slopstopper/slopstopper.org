<svg id="plumb" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="plumb-title"
     style="--pl-head:#2e9e3a;--pl-body:#ff9a1f;--pl-trim:#f47b12;--pl-green:#3fb043;--pl-line:#141414;--pl-amber:#fb9902">
  <!-- Plumb — vector reference. Figure axis x=300. Head is deliberately asymmetric:
       right side wider and lower, right eye larger (canon). Chest mark is the PL ligature. -->
  <title id="plumb-title">Plumb, the plumb-line character</title>
  <g fill="none" stroke="var(--pl-line)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g id="antenna">
      <line x1="300" y1="168" x2="300" y2="206"/>
      <g id="rays" stroke="var(--pl-amber)" stroke-width="7" opacity="0">
        <line x1="300" y1="112" x2="300" y2="96"/><line x1="330" y1="124" x2="341" y2="112"/>
        <line x1="342" y1="152" x2="358" y2="152"/><line x1="270" y1="124" x2="259" y2="112"/>
        <line x1="258" y1="152" x2="242" y2="152"/><line x1="300" y1="192" x2="300" y2="204"/>
      </g>
      <circle id="bob" cx="300" cy="152" r="16" fill="var(--pl-green)"/>
    </g>
    <g id="head">
      <path id="head-shape" fill="var(--pl-head)"
        d="M 296 204 C 218 204 166 246 164 316 C 162 388 200 440 292 446 C 396 452 480 414 480 338 C 480 260 402 204 296 204 Z"/>
      <ellipse id="eye-l" cx="244" cy="322" rx="21" ry="30" fill="var(--pl-line)" stroke="none"/>
      <ellipse id="eye-r" cx="378" cy="318" rx="31" ry="44" fill="var(--pl-line)" stroke="none"/>
    </g>
    <rect id="collar" x="250" y="442" width="100" height="30" rx="14" fill="var(--pl-trim)"/>
    <g id="body">
      <path id="body-shape" fill="var(--pl-body)"
        d="M 300 470 C 236 470 196 520 186 590 C 174 676 222 742 300 744 C 378 742 426 676 414 590 C 404 520 364 470 300 470 Z"/>
      <path id="mark-pl" stroke-width="10"
        d="M 280 556 V 664 H 322 M 280 556 H 308 C 340 556 340 608 308 608 H 280"/>
    </g>
    <g id="arm-l">
      <path d="M 206 520 C 172 560 164 620 184 662" stroke-width="34"/>
      <path d="M 206 520 C 172 560 164 620 184 662" stroke="var(--pl-body)" stroke-width="18"/>
      <circle cx="182" cy="674" r="16" fill="var(--pl-green)" stroke-width="7"/>
    </g>
    <g id="arm-r">
      <path d="M 394 520 C 428 560 436 620 416 662" stroke-width="34"/>
      <path d="M 394 520 C 428 560 436 620 416 662" stroke="var(--pl-body)" stroke-width="18"/>
      <path id="hand-heart" fill="var(--pl-green)" stroke-width="7"
        d="M 418 690 C 394 672 398 646 418 656 C 438 646 442 672 418 690 Z"/>
    </g>
    <g id="legs" fill="var(--pl-trim)">
      <rect x="256" y="732" width="36" height="58" rx="14"/>
      <rect x="308" y="732" width="36" height="58" rx="14"/>
    </g>
    <g id="feet" fill="var(--pl-green)">
      <ellipse cx="266" cy="800" rx="40" ry="19"/>
      <ellipse cx="334" cy="800" rx="40" ry="19"/>
    </g>
  </g>
</svg>
